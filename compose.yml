name: resolveia

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveia_local}
      POSTGRES_DB: ${POSTGRES_DB:-resolveia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-resolveia} -d ${POSTGRES_DB:-resolveia}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
