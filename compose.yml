name: resolveia

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resolveia}:${POSTGRES_PASSWORD:-resolveia_local}@postgres:5432/${POSTGRES_DB:-resolveia}
  OBJECT_STORAGE_ENDPOINT_URL: http://seaweedfs:8333
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-resolveia_local}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-resolveia_local_secret}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-resolveia-knowledge}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-resolveia}:${RABBITMQ_PASSWORD:-resolveia_local}@rabbitmq:5672//

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveia_local}
      POSTGRES_DB: ${POSTGRES_DB:-resolveia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-resolveia} -d ${POSTGRES_DB:-resolveia}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9333/cluster/healthz
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-resolveia}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-resolveia_local}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  extraction-worker:
    build: .
    command:
      - celery
      - --app=resolveia.infrastructure.messaging.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=knowledge-extraction
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app=resolveia.infrastructure.messaging.celery_app:celery_app inspect ping --timeout=5
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  outbox-dispatcher:
    build: .
    command:
      - python
      - -m
      - resolveia.infrastructure.messaging.dispatcher
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/resolveia-dispatcher-heartbeat && find /tmp/resolveia-dispatcher-heartbeat -mmin -1 | grep -q .
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  seaweedfs_data:
  rabbitmq_data:
