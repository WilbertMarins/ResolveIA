name: resolveia

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveia_local}
      POSTGRES_DB: ${POSTGRES_DB:-resolveia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-resolveia} -d ${POSTGRES_DB:-resolveia}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9333/cluster/healthz
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  seaweedfs_data:
