[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "resolveia"
version = "0.1.0"
description = "Multi-agent technical support platform for a fictional payment API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.147,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.53,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
required-version = ">=0.11.15,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveia"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
