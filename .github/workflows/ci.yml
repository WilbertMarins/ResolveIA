name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+asyncpg://resolveia:resolveia_ci@127.0.0.1:5433/resolveia
      OBJECT_STORAGE_ENDPOINT_URL: http://127.0.0.1:8333
      OBJECT_STORAGE_ACCESS_KEY: resolveia_ci
      OBJECT_STORAGE_SECRET_KEY: resolveia_ci_secret
      OBJECT_STORAGE_BUCKET: resolveia-knowledge
      OBJECT_STORAGE_REGION: us-east-1

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: resolveia
          POSTGRES_PASSWORD: resolveia_ci
          POSTGRES_DB: resolveia
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U resolveia -d resolveia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Start SeaweedFS
        run: >-
          docker run --detach --name resolveia-seaweedfs
          --publish 8333:8333 --publish 9333:9333
          chrislusf/seaweedfs:4.46
          server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0

      - name: Wait for SeaweedFS
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9333/cluster/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs resolveia-seaweedfs
          exit 1

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply database migrations
        run: uv run --frozen alembic upgrade head

      - name: Initialize object storage
        run: uv run --frozen python -m resolveia.infrastructure.storage.bootstrap

      - name: Run lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check types
        run: uv run --frozen mypy src tests

      - name: Run tests
        run: uv run --frozen pytest
